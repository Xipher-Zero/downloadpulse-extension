# Dependabot (1.0.8, SC-D1): weekly update PRs for the npm toolchain in package-lock.json and for
# the SHA-pinned actions in .github/workflows. An update lands through CI and review like any change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      # @playwright/test and the playwright packages it pins move together, with the
      # browsers CI downloads for them.
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
