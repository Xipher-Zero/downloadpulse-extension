# SPDX-License-Identifier: GPL-2.0-or-later
# Release (1.0.8, SC-4): a pushed tag v<version> builds the release zips from that tag, writes
# SHA256SUMS, attests their build provenance, and attaches all of them to a DRAFT pre-release
# for that tag. Nothing is published here: the operator checks the draft and publishes it
# (BUILDING.md, "Releasing"). Versions move in lockstep with DownloadPulse: the tag must equal
# package.json's version.
#
# Least privilege, one job each: the build (which runs npm packages and browsers) reads only;
# only the attest job can mint an OIDC token and write attestations; only the release job can
# write the release, and it runs nothing from the repository or npm. No cache is read, so no
# cache another ref wrote can reach a release build.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The browsers' download alone has taken 11-15 minutes on hosted runners (1.0.3), uncached here.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: The tag names this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - name: Unit, end-to-end and smoke tests
        run: npm test
      - run: npm run package
      - name: Checksums
        working-directory: web-ext-artifacts
        run: |
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: The zips are the ones summed
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

  release:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Attach to the tag's draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # A release the operator already published is never changed by a re-run.
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; not replacing its files"
              exit 1
            fi
            gh release upload "$TAG" --clobber *.zip SHA256SUMS
          else
            gh release create "$TAG" --draft --prerelease --verify-tag --title "$TAG" \
              --notes "Built by the Release workflow from $TAG ($GITHUB_SHA). Verify: see BUILDING.md, \"Verifying a release\"." \
              *.zip SHA256SUMS
          fi
