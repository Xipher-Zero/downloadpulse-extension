<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-or-later -->
<!-- The toolbar dropdown, and (built from this same file, with
     data-standalone="settings") the browser's own settings page for the
     extension: one markup, one script (scripts/build.mjs). -->
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="dp-popup">
    <header class="dp-head">
      <h1 class="dp-head__title dp-brand"><span data-logo-slot></span><span class="dp-brand__name">Download<span>Pulse</span></span></h1>
      <button type="button" class="dp-glyph-btn" data-action="settings" data-i18n-label="popupSettings">
        <span data-glyph-slot="settings"></span>
      </button>
      <!-- Back stands where the gear does: the title row's end (operator, 2026-11-18). -->
      <button type="button" class="dp-glyph-btn" data-action="back" data-i18n-label="popupBack" hidden>
        <span data-glyph-slot="chevronLeft"></span>
      </button>
    </header>

    <!-- The first screen (operator, 2026-11-18): what the extension does, the
         ways it is used, the next step, and one tile to connect. -->
    <section data-state="disconnected" class="dp-welcome" hidden>
      <p class="dp-welcome__lead" data-i18n="welcomeLead"></p>
      <ul class="dp-welcome__ways">
        <li data-i18n="welcomeHover"></li>
        <li data-i18n="welcomeHighlight"></li>
        <li data-testid="welcome-right-click"></li>
        <li data-i18n="welcomeProgress"></li>
      </ul>
      <p class="dp-welcome__next" data-i18n="welcomeConnectHint"></p>
      <button type="button" class="dp-btn dp-btn--primary dp-connect-tile" data-action="connect-local" data-i18n-label="popupConnect">
        <span data-i18n="connectTileTop"></span>
        <span class="dp-connect-tile__glyph" data-glyph-slot="plug"></span>
        <span data-i18n="connectTileBottom"></span>
      </button>
      <p class="dp-welcome__state" data-testid="status"><span class="dp-welcome__dot" aria-hidden="true"></span><span data-i18n="popupNotConnected"></span></p>
    </section>

    <!-- Before connecting: what this browser sends to DownloadPulse, agreed to before
         anything is sent (store review, 2026-11-18; PRIVACY.md). -->
    <section data-state="disclosure" class="dp-disclosure" hidden>
      <p class="dp-welcome__lead" data-i18n="discloseLead"></p>
      <ul class="dp-welcome__ways">
        <li data-i18n="discloseLinks"></li>
        <li data-i18n="discloseVideo"></li>
        <li data-i18n="discloseDownloads"></li>
        <li data-i18n="disclosePolling"></li>
      </ul>
      <p class="dp-welcome__next" data-i18n="discloseStays"></p>
      <label class="dp-check dp-disclosure__device"><input type="checkbox" data-testid="device-name"> <span data-i18n="discloseDeviceName"></span></label>
      <a class="dp-disclosure__policy" data-testid="privacy-policy" target="_blank" rel="noopener" data-i18n="privacyPolicy"></a>
      <button type="button" class="dp-btn dp-btn--primary" data-action="agree" data-i18n="discloseAgree"></button>
      <button type="button" class="dp-btn dp-btn--ghost dp-disclosure__back" data-action="screen-back" data-i18n="popupBack"></button>
    </section>

    <!-- A plain-HTTP server on a private network: the person's deliberate choice, explained first. -->
    <section data-state="insecure" class="dp-insecure" hidden>
      <div class="dp-caution__status" role="alert">
        <span class="dp-failed__glyph" data-glyph-slot="triangleAlert"></span>
        <p class="dp-failed__text" data-i18n="insecureTitle"></p>
      </div>
      <p class="dp-welcome__next dp-insecure__text" data-testid="insecure-text"></p>
      <p class="dp-welcome__next dp-insecure__text" data-testid="insecure-shared-range" data-i18n="insecureSharedRange" hidden></p>
      <button type="button" class="dp-btn dp-btn--primary" data-action="insecure-continue" data-i18n="insecureContinue"></button>
      <button type="button" class="dp-btn dp-btn--ghost dp-disclosure__back" data-action="screen-back" data-i18n="popupBack"></button>
    </section>

    <section data-state="probing" hidden>
      <p class="dp-popup__status" role="status" data-i18n="popupProbing"></p>
    </section>

    <!-- Found on this computer: choose it or a remote server, as DownloadPulse's
         first-run wizard chooses a deployment type (cards, a glyph, a hint). -->
    <section data-state="found" class="dp-found" hidden>
      <p class="dp-found__intro" data-i18n="foundIntro"></p>
      <p class="dp-found__status" role="status"><span class="dp-found__dot" aria-hidden="true"></span><span data-i18n="popupFoundLocal"></span></p>
      <div class="dp-choices" role="radiogroup" data-i18n-aria="popupChooseInstance">
        <button type="button" class="dp-choice" role="radio" aria-checked="true" data-choice="local">
          <span class="dp-choice__name" data-i18n="choiceLocalTitle"></span>
          <span class="dp-choice__glyph" data-glyph-slot="monitor"></span>
          <span class="dp-choice__text" data-i18n="choiceLocalHint"></span>
        </button>
        <button type="button" class="dp-choice" role="radio" aria-checked="false" tabindex="-1" data-choice="remote">
          <span class="dp-choice__name" data-i18n="choiceRemoteTitle"></span>
          <span class="dp-choice__glyph" data-glyph-slot="server"></span>
          <span class="dp-choice__text" data-i18n="choiceRemoteHint"></span>
        </button>
      </div>
      <!-- One slot for what follows the choice, as tall as its tallest: the page
           keeps one geometry whichever card is chosen (operator, 2026-11-18). -->
      <div class="dp-found__slot">
        <p class="dp-found__next" data-panel="local" data-i18n="localApproveHint"></p>
        <form class="dp-popup__remote" id="remote-found" data-panel="remote">
          <p class="dp-found__next" data-testid="remote-hint"></p>
          <label class="dp-popup__label" for="server-found" data-i18n="popupServerLabel"></label>
          <input id="server-found" name="server" type="text" autocomplete="url" spellcheck="false" required
                 data-i18n-placeholder="popupServerPlaceholder">
        </form>
      </div>
      <button type="button" class="dp-btn dp-btn--primary" data-action="connect-chosen" data-i18n="popupConnectAction"></button>
    </section>

    <section data-state="not_found" hidden>
      <p class="dp-popup__status" data-i18n="popupNotFound"></p>
      <button type="button" class="dp-btn" data-action="connect-local" data-i18n="popupCheckAgain"></button>
      <form class="dp-popup__remote" data-action="connect-remote">
        <label class="dp-popup__label" for="server" data-i18n="popupServerLabel"></label>
        <input id="server" name="server" type="text" autocomplete="url" spellcheck="false" required
               data-i18n-placeholder="popupServerPlaceholder">
        <button type="submit" class="dp-btn dp-btn--primary" data-i18n="popupConnectServer"></button>
      </form>
    </section>

    <section data-state="waiting" hidden>
      <p class="dp-popup__status" role="status" data-i18n="popupWaiting"></p>
      <p class="dp-popup__code-row"><span data-i18n="popupCode"></span> <strong class="dp-popup__code" data-testid="code"></strong></p>
      <p class="dp-popup__hint" data-i18n="popupCodeHint"></p>
      <button type="button" class="dp-btn" data-action="cancel" data-i18n="popupCancel"></button>
    </section>

    <!-- Connecting failed, for whichever reason: the reason as a status, and one way
         on -- connecting again, which offers this computer and a remote server. -->
    <section data-state="failed" class="dp-failed" hidden>
      <div class="dp-failed__status" role="alert">
        <span class="dp-failed__glyph" data-glyph-slot="circleX"></span>
        <p class="dp-failed__text" data-testid="failure"></p>
      </div>
      <button type="button" class="dp-btn dp-btn--primary dp-failed__again" data-action="connect-local">
        <span class="dp-failed__plug" data-glyph-slot="plug"></span><span data-i18n="popupConnectAgain"></span>
      </button>
    </section>

    <!-- Right after connecting, once (1.0.2, operator 2026-11-22): browser downloads to DownloadPulse
         instead, asked for here or later in Settings -- never assumed. -->
    <section data-state="capture-offer" class="dp-disclosure" hidden>
      <p class="dp-welcome__lead" data-i18n="captureOfferTitle"></p>
      <p class="dp-welcome__next" data-i18n="captureOfferText"></p>
      <p class="dp-settings__centred" role="status" data-testid="capture-offer-note" hidden></p>
      <button type="button" class="dp-btn dp-btn--primary" data-action="capture-yes" data-i18n="captureOfferYes"></button>
      <button type="button" class="dp-btn dp-btn--ghost dp-disclosure__back" data-action="capture-no" data-i18n="captureOfferNo"></button>
    </section>

    <section data-state="connected" hidden>
      <div class="dp-conn">
        <span class="dp-conn__status" data-testid="reach" data-reach="checking">
          <span class="dp-conn__dot" aria-hidden="true"></span><span data-testid="reach-text"></span>
        </span>
        <button type="button" class="dp-glyph-btn dp-glyph-btn--bare dp-conn__toggle" data-action="details"
                aria-expanded="false" aria-controls="facts" data-i18n-label="popupConnectionDetails">
          <span data-glyph-slot="chevronRight"></span>
        </button>
      </div>
      <dl class="dp-facts" id="facts" hidden>
        <div><dt data-i18n="popupServer"></dt><dd data-testid="server"></dd></div>
        <div><dt data-i18n="popupAccount"></dt><dd data-testid="account"></dd></div>
        <div><dt data-i18n="popupBrowser"></dt><dd data-testid="label"></dd></div>
      </dl>
      <section class="dp-quick" aria-labelledby="quick-title">
        <div class="dp-quick__head">
          <h2 class="dp-popup__heading" id="quick-title" data-i18n="quickAddTitle"></h2>
          <span class="dp-quick__result" data-testid="quick-result" role="status" aria-live="polite"></span>
        </div>
        <form class="dp-site-add dp-quick__form" data-action="quick-add">
          <label class="dp-visually-hidden" for="quick" data-i18n="quickAddPlaceholder"></label>
          <input id="quick" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="quickAddPlaceholder">
          <button type="submit" class="dp-btn dp-btn--primary dp-btn--sm" data-i18n="quickAddButton"></button>
        </form>
      </section>
      <label class="dp-check dp-capture-switch"><input type="checkbox" disabled data-capture-switch data-testid="capture-main">
        <span data-i18n="captureToggle"></span></label>
      <h2 class="dp-popup__heading" data-i18n="listTitle"></h2>
      <p class="dp-popup__hint" data-i18n="listEmpty" data-testid="list-empty"></p>
      <ul class="dp-jobs" data-testid="jobs"></ul>
      <footer class="dp-foot">
        <button type="button" class="dp-btn dp-btn--ghost" data-action="open" data-testid="open-server" data-i18n="popupOpenServer"></button>
        <button type="button" class="dp-glyph-btn dp-glyph-btn--danger" data-action="clear-list" data-testid="clear-list"
                data-i18n-label="listClear">
          <span data-glyph-slot="trash2"></span>
        </button>
      </footer>
    </section>

    <section data-view="settings" class="dp-settings" hidden>
      <h2 class="dp-settings__title" data-i18n="popupSettings"></h2>

      <section class="dp-settings__group" aria-labelledby="connection-title">
        <h3 id="connection-title" data-i18n="optionsConnection"></h3>
        <div class="dp-settings__connection" data-connection="connected" hidden>
          <dl class="dp-facts">
            <div><dt data-i18n="popupServer"></dt><dd data-testid="settings-server"></dd></div>
            <div><dt data-i18n="popupAccount"></dt><dd data-testid="settings-account"></dd></div>
            <div><dt data-i18n="popupBrowser"></dt><dd data-testid="settings-label"></dd></div>
          </dl>
          <p class="dp-settings__centred" data-i18n="optionsDisconnectHint"></p>
          <button type="button" class="dp-btn dp-btn--danger dp-btn--sm dp-settings__disconnect" data-action="disconnect" data-i18n="optionsDisconnect"></button>
        </div>
        <p class="dp-settings__centred" data-connection="disconnected" data-i18n="optionsNotConnected" hidden></p>
        <p class="dp-settings__centred" role="status" data-testid="connection-note" hidden></p>
      </section>

      <section class="dp-settings__group" aria-labelledby="page-title">
        <h3 id="page-title" data-i18n="optionsOnPages"></h3>
        <!-- The in-page buttons' master switch: off, none is offered, and what depends
             on it is not shown (its choices are kept for when it is on again). -->
        <label class="dp-check"><input type="checkbox" disabled data-setting="inPage"> <span data-i18n="optionsInPage"></span></label>
        <div class="dp-settings__dependent" data-testid="in-page-options">
          <label class="dp-check"><input type="checkbox" disabled data-setting="hover"> <span data-i18n="optionsHover"></span></label>
          <label class="dp-check"><input type="checkbox" disabled data-setting="video"> <span data-i18n="optionsVideo"></span></label>
          <label class="dp-check" data-testid="site-switch" hidden>
            <input type="checkbox" disabled data-testid="site-on"> <span data-testid="site-text"></span>
          </label>
          <h4 data-i18n="optionsOffSites"></h4>
          <p class="dp-settings__centred" data-i18n="optionsOffSitesHint"></p>
          <ul class="dp-sites" data-testid="off-sites"></ul>
          <form class="dp-site-add" data-action="add-site">
            <label class="dp-visually-hidden" for="site" data-i18n="optionsSiteLabel"></label>
            <input id="site" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="optionsSitePlaceholder">
            <button type="submit" class="dp-btn dp-btn--sm" data-i18n="optionsAddSite"></button>
          </form>
        </div>
        <!-- The sign-in switch governs videos AND browser downloads (1.0.4): shown
             whatever the in-page master switch is, since browser downloads do not
             depend on it. -->
        <label class="dp-check"><input type="checkbox" disabled data-setting="videoCookies"> <span data-i18n="optionsVideoCookies"></span></label>
      </section>

      <section class="dp-settings__group" aria-labelledby="downloads-title">
        <h3 id="downloads-title" data-i18n="optionsDownloads"></h3>
        <label class="dp-check"><input type="checkbox" disabled data-capture-switch data-testid="capture-setting">
          <span data-i18n="captureToggle"></span></label>
        <p class="dp-settings__centred" data-i18n="optionsDownloadsHint" data-testid="capture-hint"></p>
        <p class="dp-settings__centred" role="status" data-testid="capture-note" hidden></p>
        <div class="dp-settings__dependent" data-testid="capture-options">
          <label class="dp-settings__field"><span data-i18n="optionsMinSize"></span>
            <input type="number" min="0" max="100000" step="1" inputmode="numeric" disabled data-capture-min></label>
          <label class="dp-settings__field"><span data-i18n="optionsSkipTypes"></span>
            <input type="text" spellcheck="false" autocomplete="off" disabled data-capture-types
                   data-i18n-placeholder="optionsSkipTypesPlaceholder"></label>
        </div>
      </section>

      <section class="dp-settings__group" aria-labelledby="notify-title">
        <h3 id="notify-title" data-i18n="optionsNotifications"></h3>
        <label class="dp-check"><input type="checkbox" disabled data-notify="completed"> <span data-i18n="optionsNotifyCompleted"></span></label>
        <label class="dp-check"><input type="checkbox" disabled data-notify="failed"> <span data-i18n="optionsNotifyFailed"></span></label>
        <label class="dp-check"><input type="checkbox" disabled data-notify="attention"> <span data-i18n="optionsNotifyAttention"></span></label>
        <a class="dp-disclosure__policy" data-testid="settings-privacy-policy" target="_blank" rel="noopener" data-i18n="privacyPolicy"></a>
      </section>
    </section>
  </main>
</body>
</html>
